<!doctype html>
<!--
  STM promo: one shape that never cuts, on a canvas that floods a new color every section.
  Every style is a pure function of time: seek(t). No CSS transitions, no timers, no state between frames.
  Open directly in a browser to preview (?lang=vi for Vietnamese, ?t=3.2 to freeze a frame);
  scripts/render.mjs drives seek(t) for export. Frame D equals frame 0, so the export loops.
-->
<html>
<head>
<meta charset="utf-8" />
<title>STM promo</title>
<style id="fontfaces"></style>
<style>
  html, body { margin: 0; background: #111; }
  body.preview { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
  body.preview #stage { transform: scale(var(--fit, 0.5)); transform-origin: center; flex-shrink: 0; }
  #stage {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'BVP', 'Noto Color Emoji', sans-serif; -webkit-font-smoothing: antialiased; color: #17112B;
    font-feature-settings: 'tnum' 1;
  }
  #wipe { position: absolute; border-radius: 50%; }
  .deco { position: absolute; }
  /* never add will-change here: the camera scales this subtree and text would rasterize blurry */
  #world { position: absolute; left: 540px; top: 640px; width: 0; height: 0; transform-origin: 0 0; }
  #shape { position: absolute; overflow: hidden; }
  .layer, .abs { position: absolute; }
  .nw { white-space: nowrap; }
  svg { display: block; overflow: visible; }
  .stroke { fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: 'JBM', monospace; }
  #cursor { position: absolute; left: 0; top: 0; width: 48px; height: 48px; transform-origin: 19.5px 2.4px; filter: drop-shadow(0 3px 4px rgba(23,17,43,0.35)); }
  .cap { position: absolute; left: 0; right: 0; top: 64px; text-align: center; }
  .cap .chip { display: inline-block; padding: 0 16px; height: 34px; line-height: 34px; border-radius: 17px; font-size: 17px; font-weight: 700; letter-spacing: 1.5px; background: rgba(255,255,255,0.22); }
  .cap .tt { margin-top: 14px; font-size: 64px; line-height: 72px; font-weight: 800; letter-spacing: -1.8px; white-space: nowrap; }
  .bub { position: absolute; padding: 12px 17px; border-radius: 20px; font-size: 17px; line-height: 23px; font-weight: 500; max-width: 290px; width: max-content; transform-origin: 0 100%; }
  .row { position: absolute; left: 12px; right: 12px; height: 48px; line-height: 48px; padding-left: 16px; font-size: 19px; font-weight: 500; }
  .pill { position: absolute; height: 34px; line-height: 34px; padding: 0 14px 0 12px; border-radius: 17px; font-size: 15px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
  .key { position: absolute; width: 58px; height: 58px; border-radius: 29px; background: rgba(255,255,255,0.12); color: #fff; text-align: center; line-height: 58px; font-size: 24px; font-weight: 500; }
  .pchip { position: absolute; height: 42px; padding: 0 15px 0 12px; border-radius: 21px; font-size: 16px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 9px; box-shadow: 0 12px 26px -14px rgba(0,0,0,0.6); }
  .btn { position: absolute; height: 48px; line-height: 48px; border-radius: 24px; text-align: center; font-size: 17px; font-weight: 700; white-space: nowrap; }
  /* Android home screen */
  .app { position: absolute; width: 50px; height: 50px; border-radius: 16px; text-align: center; line-height: 52px; font-size: 26px; }
  .appl { position: absolute; width: 74px; text-align: center; font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.35); white-space: nowrap; }
  .head { position: absolute; width: 60px; height: 60px; border-radius: 30px; background-size: cover; background-position: center; box-shadow: 0 8px 18px -6px rgba(0,0,0,0.45); }
  .head .bd { position: absolute; right: -4px; top: -4px; width: 24px; height: 24px; border-radius: 12px; background: #FF3B30; color: #fff; font-size: 13px; font-weight: 800; text-align: center; line-height: 20px; box-sizing: border-box; border: 2px solid #fff; }
  /* SillyTavern, rebuilt small: dark top bar, translucent message blocks over a tavern tint, italics grey, quotes orange */
  .st { position: absolute; inset: 0; overflow: hidden; color: #DCDCD2; font-size: 12.5px; line-height: 17px; background: #2e221b url(assets/st/tavern-day.jpg) center / cover; }
  .st .bar { position: absolute; left: 0; right: 0; height: 34px; background: rgba(23,23,23,0.94); border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-evenly; align-items: center; color: #9a9a9a; }
  .st .chat { position: absolute; left: 0; right: 0; bottom: 50px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; padding: 0 6px; }
  .st .mes { display: flex; gap: 8px; padding: 8px 8px; border-radius: 10px; background: rgba(18,14,12,0.78); margin-top: 6px; transform-origin: 0 100%; }
  .st .av { width: 32px; height: 32px; border-radius: 16px; flex: none; background-size: cover; background-position: center; }
  .st .nm { font-weight: 700; color: #fff; font-size: 13px; line-height: 16px; white-space: nowrap; }
  .st .avc { flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .st .mid { color: #8a8a8a; font-weight: 600; font-size: 10px; line-height: 12px; }
  .st .tx { margin-top: 2px; min-height: 17px; }
  .st .tx em { color: #A6A6A6; }
  .st .tx .q { color: #E18A24; }
  .st .send { position: absolute; left: 6px; right: 6px; bottom: 8px; height: 36px; border-radius: 10px; background: rgba(23,23,23,0.95); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 9px; padding: 0 10px; color: #8a8a8a; font-size: 12px; box-sizing: border-box; }
  /* the bubble keeps an opaque SillyTavern backdrop while chats cross-fade inside it */
  #panel { background: #2e221b url(assets/st/tavern-day.jpg) center / cover; }
  /* the chat inside the bubble is set large: it has to read at a glance in a small video embed */
  .st.big { font-size: 15.5px; line-height: 21px; }
  .st.big .bar { height: 40px; }
  .st.big .mes { gap: 10px; padding: 10px; margin-top: 8px; }
  .st.big .av { width: 42px; height: 42px; border-radius: 21px; }
  .st.big .nm { font-size: 15.5px; line-height: 19px; }
  .st.big .mid { font-size: 12px; line-height: 14px; }
  .st.big .chat { bottom: 56px; }
  .st.big .send { height: 42px; font-size: 14px; }
  .dev { position: absolute; }
  .dlbl { position: absolute; height: 40px; line-height: 40px; padding: 0 16px 0 10px; border-radius: 20px; background: #fff; font-size: 17px; font-weight: 750; white-space: nowrap; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 24px -12px rgba(23,17,43,0.45); }
</style>
</head>
<body>
<div id="stage">

        <div class="abs" id="apkC" style="inset:0">

            <div style="width:30px;height:30px;border-radius:15px;background:#1FAA59;color:#fff;position:relative"><svg class="abs" style="left:7px;top:7px" width="16" height="16" viewBox="0 0 24 24"><path class="stroke" style="stroke-width:3.6" d="M20 6 9 17l-5-5"/></svg></div>

        <div class="abs" style="left:28px;top:44px;width:280px;height:44px;overflow:hidden">
          <div class="abs nw" id="verA" style="left:0;top:0;display:flex;align-items:center;gap:12px"><span style="font-size:31px;font-weight:750;letter-spacing:-0.6px;line-height:44px">1.19.0</span><span class="pill" data-t="latest" style="position:static;height:28px;line-height:28px;background:#DDF8EC;color:#0E8F5A"></span></div>

          </div>

      <!-- access link: QR card -->

        <div class="abs" style="left:101px;top:101px;width:38px;height:38px;border-radius:10px;background:#fff">
          <img class="abs" src="../apps/manager-panel/public/icon-512.png" style="left:4px;top:4px;width:30px;height:30px" />

// ---------- time ----------
const BEATS = 44 // 11 bars of 4/4
let B = 60 / 100 // seconds per beat
const D = () => BEATS * B

// ---------- springs ----------
// closed-form step response of a damped spring, 0 -> 1. f in Hz, z = damping ratio
function S(t, f, z) {
  if (t <= 0) return 0
  const w = 2 * Math.PI * f
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t)
  const wd = w * Math.sqrt(1 - z * z)
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t))
}
// one-shot bump peaking at 1 after 1/(2πf) seconds, then decaying to 0
function pulse(t, f) {
  if (t <= 0) return 0
  const x = 2 * Math.PI * f * t
  return x * Math.exp(1 - x)
}
const SPR = {
  shape: { f: 1.9, z: 0.8 },
  cam: { f: 1.2, z: 0.95 },
  enter: { f: 3.6, z: 1 },
  exit: { f: 8, z: 1 },
  cursor: { f: 2.3, z: 1 },
  drag: { f: 1.25, z: 1 },
  press: { f: 10, z: 1 },
  lead: { f: 3.4, z: 0.78 },
  trail: { f: 1.7, z: 0.92 },
  slow: { f: 0.9, z: 1 },
  snap: { f: 3, z: 0.62 },
}

// A value that changes target many times is the sum of one spring per change.
// Cyclic: keys repeat every D, older cycles are included so frame D equals frame 0.
function track(keys, def = SPR.shape) {
  const ks = keys.map(([b, v, s]) => [((b % BEATS) + BEATS) % BEATS, v, s || def]).sort((a, b) => a[0] - b[0])
  const n = ks.length
  const deltas = ks.map((k, i) => k[1] - ks[(i - 1 + n) % n][1])
  const base = ks[n - 1][1]
  return (t) => {
    let v = base
    const d = D()
    for (let c = -3; c <= 0; c++) {
      for (let i = 0; i < n; i++) {
        if (deltas[i] === 0) continue
        v += deltas[i] * S(t - ks[i][0] * B - c * d, ks[i][2].f, ks[i][2].z)
      }
    }
    return v
  }
}
const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, p) => a + (b - a) * p
// beats since key b inside the loop (cyclic, 0..BEATS)
const since = (tb, b) => (((tb - b) % BEATS) + BEATS) % BEATS
const inSpan = (tb, a, z) => since(tb, a) < since(z, a)
function mixColor(a, b, p) {
  const A = hexToRgb(a), Bc = hexToRgb(b)
  return `rgb(${A.map((v, i) => Math.round(lerp(v, Bc[i], clamp(p)))).join(',')})`
}
// on between two beats; returns the eased visibility
const vis = (a, z, sa = SPR.enter, sz = SPR.exit) => track([[a, 1, sa], [z, 0, sz]])

// *narration* in italics, "speech" in quote color; n limits how many characters are shown
function emWrap(src, n) {
  let out = '', shown = 0, em = false, q = false
  for (const ch of src) {
    if (ch === '*') { out += em ? '</em>' : '<em>'; em = !em; continue }
    if (shown >= n) break
    if (ch === '"') { out += q ? '"</span>' : '<span class="q">"'; q = !q; shown++; continue }
    out += ch
    shown++
  }
  if (q) out += '</span>'
  if (em) out += '</em>'
  return out
}

    ...STREAM.map(([b]) => ({ b, kind: 'msg' })),
    ...PIN_AT.map((b) => ({ b, kind: 'tick', key: 1 })), { b: UNLOCK, kind: 'success' }, { b: UNLOCK + 0.25, kind: 'msg' },
    ...LBL_AT.map((b) => ({ b, kind: 'pop', soft: 1 })),
    ...CHIP_AT.map((b) => ({ b, kind: 'pop', soft: 1 })),
  ]
  return list.map((c) => ({ ...c, t: (((c.b % BEATS) + BEATS) % BEATS) * B }))
}

// ---------- api ----------
window.seek = seek
window.configure = ({ beat }) => { if (beat) B = beat }
window.timeline = () => ({ beat: B, beats: BEATS, duration: D(), lang: LANG, cues: cues() })
// CSS backgrounds are not in document.images, so load them up front as well
const preload = (src) => new Promise((done) => { const i = new Image(); i.onload = i.onerror = done; i.src = src })
const CSS_IMAGES = ['assets/st/tavern-day.jpg', 'assets/st/user.png', ...HEADS.map((h) => h.img)]
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {})), ...CSS_IMAGES.map(preload)]).then(() => { layoutStatic(); seek(0) })

if (!window.__RENDER__) {
  document.body.classList.add('preview')
  const fit = () => document.body.style.setProperty('--fit', Math.min(innerWidth, innerHeight) / 1080)
  fit(); addEventListener('resize', fit)
  const params = new URLSearchParams(location.search)
  window.ready.then(() => {
    if (params.has('t')) seek(+params.get('t'))
    else {
      const t0 = performance.now()
      const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop) }
      loop()
    }
  })
}
</script>
