<!doctype html>
<!--
  STM promo: one shape that never cuts, on a canvas that floods a new color every section.
  Light components only: white cards, one idea each, as little text as possible.
  Every style is a pure function of time: seek(t). No CSS transitions, no timers, no state between frames.
  Open directly in a browser to preview (?lang=vi for Vietnamese, ?t=3.2 to freeze a frame);
  scripts/render.mjs drives seek(t) for export. Frame D equals frame 0, so the export loops.
-->
<html>
<head>
<meta charset="utf-8" />
<title>STM promo</title>
<style id="fontfaces"></style>
<style>
  html, body { margin: 0; background: #111; }
  body.preview { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
  body.preview #stage { transform: scale(var(--fit, 0.5)); transform-origin: center; flex-shrink: 0; }
  #stage {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'BVP', 'Noto Color Emoji', sans-serif; -webkit-font-smoothing: antialiased; color: #17112B;
    font-feature-settings: 'tnum' 1;
  }
  #wipe { position: absolute; border-radius: 50%; }
  .deco { position: absolute; }
  /* never add will-change here: the camera scales this subtree and text would rasterize blurry */
  #world { position: absolute; left: 540px; top: 620px; width: 0; height: 0; transform-origin: 0 0; }
  #shape { position: absolute; overflow: hidden; }
  .layer, .abs { position: absolute; }
  .nw { white-space: nowrap; }
  svg { display: block; overflow: visible; }
  .stroke { fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: 'JBM', monospace; }
  #cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; transform-origin: 6px 4px; }
  .cap { position: absolute; left: 0; right: 0; top: 60px; text-align: center; }
  .cap .chip { display: inline-block; padding: 0 16px; height: 34px; line-height: 34px; border-radius: 17px; font-size: 17px; font-weight: 700; letter-spacing: 1.5px; background: rgba(255,255,255,0.24); }
  .cap .tt { margin-top: 14px; font-size: 64px; line-height: 72px; font-weight: 800; letter-spacing: -1.8px; white-space: nowrap; }
  .cap .st { margin-top: 4px; font-size: 26px; line-height: 34px; font-weight: 600; opacity: 0.8; white-space: nowrap; }
  .bub { position: absolute; padding: 12px 17px; border-radius: 20px; font-size: 18px; line-height: 24px; font-weight: 500; max-width: 270px; width: max-content; transform-origin: 0 100%; }
  .bub.in { background: #F1EEFB; color: #17112B; border-bottom-left-radius: 6px; }
  .bub.out { background: #FF4FA0; color: #fff; border-bottom-right-radius: 6px; transform-origin: 100% 100%; }
  .row { position: absolute; left: 12px; right: 12px; height: 52px; line-height: 52px; padding-left: 22px; font-size: 22px; font-weight: 500; }
  .pchip { position: absolute; height: 42px; line-height: 42px; padding: 0 18px; border-radius: 21px; background: #fff; color: #17112B; font-size: 17px; font-weight: 700; white-space: nowrap; box-shadow: 0 10px 24px -12px rgba(23,17,43,0.4); }
  .ic { position: absolute; left: 16px; top: 16px; width: 72px; height: 72px; border-radius: 36px; }
  .ic svg { position: absolute; left: 20px; top: 20px; }
  .lbl { position: absolute; left: 104px; top: 0; line-height: 104px; font-size: 23px; font-weight: 750; letter-spacing: -0.4px; white-space: nowrap; }
</style>
</head>

// ---------- time ----------
const BEATS = 32 // 8 bars of 4/4
let B = 60 / 100 // seconds per beat
const D = () => BEATS * B

// ---------- springs ----------
// closed-form step response of a damped spring, 0 -> 1. f in Hz, z = damping ratio
function S(t, f, z) {
  if (t <= 0) return 0
  const w = 2 * Math.PI * f
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t)
  const wd = w * Math.sqrt(1 - z * z)
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t))
}
// one-shot bump peaking at 1 after 1/(2πf) seconds, then decaying to 0
function pulse(t, f) {
  if (t <= 0) return 0
  const x = 2 * Math.PI * f * t
  return x * Math.exp(1 - x)
}
const SPR = {
  shape: { f: 1.9, z: 0.8 },
  cam: { f: 1.2, z: 0.95 },
  enter: { f: 3.6, z: 1 },
  exit: { f: 8, z: 1 },
  cursor: { f: 2.3, z: 1 },
  drag: { f: 1.25, z: 1 },
  press: { f: 10, z: 1 },
  lead: { f: 3.4, z: 0.78 },
  trail: { f: 1.7, z: 0.92 },
  slow: { f: 0.9, z: 1 },
  snap: { f: 3, z: 0.62 },
}

// A value that changes target many times is the sum of one spring per change.
// Cyclic: keys repeat every D, older cycles are included so frame D equals frame 0.
function track(keys, def = SPR.shape) {
  const ks = keys.map(([b, v, s]) => [((b % BEATS) + BEATS) % BEATS, v, s || def]).sort((a, b) => a[0] - b[0])
  const n = ks.length
  const deltas = ks.map((k, i) => k[1] - ks[(i - 1 + n) % n][1])
  const base = ks[n - 1][1]
  return (t) => {
    let v = base
    const d = D()
    for (let c = -3; c <= 0; c++) {
      for (let i = 0; i < n; i++) {
        if (deltas[i] === 0) continue
        v += deltas[i] * S(t - ks[i][0] * B - c * d, ks[i][2].f, ks[i][2].z)
      }
    }
    return v
  }
}
const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, p) => a + (b - a) * p
// beats since key b inside the loop (cyclic, 0..BEATS)
const since = (tb, b) => (((tb - b) % BEATS) + BEATS) % BEATS
const inSpan = (tb, a, z) => since(tb, a) < since(z, a)
function mixColor(a, b, p) {
  const A = hexToRgb(a), Bc = hexToRgb(b)
  return `rgb(${A.map((v, i) => Math.round(lerp(v, Bc[i], clamp(p)))).join(',')})`
}
// on between two beats; returns the eased visibility
const vis = (a, z, sa = SPR.enter, sz = SPR.exit) => track([[a, 1, sa], [z, 0, sz]])

function wipeState(t) {
  const tb = t / B

  const prev = (best - 1 + WIPES.length) % WIPES.length
  const age = since(tb, WIPES[best].b) * B
  return { prev: WIPES[prev].color, cur: WIPES[best].color, age, t0: t - age }
}

{
  let seed = 7
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
  let rects = ''
  const finder = (x, y) => { rects += `<path d="M${x} ${y}h7v7h-7zM${x + 1} ${y + 1}v5h5v-5z M${x + 2} ${y + 2}h3v3h-3z" fill="${INK}" fill-rule="evenodd"/>` }
  finder(0, 0); finder(18, 0); finder(0, 18)
  for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
    const inFinder = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16)
    const inMid = x >= 9 && x <= 15 && y >= 9 && y <= 15
    if (inFinder || inMid) continue
    const on = y === 6 || x === 6 ? (x + y) % 2 === 0 : rnd() < 0.5
    if (on) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${INK}"/>`
  }
  rects += `<path d="M16 16h5v5h-5zM17 17v3h3v-3z M18 18h1v1h-1z" fill="${INK}" fill-rule="evenodd"/>`
  $('qrSvg').innerHTML = rects

function visStyle(el, v, blurMax = 10) {
  el.style.opacity = clamp(v).toFixed(4)
  const b = (1 - clamp(v)) * blurMax
  el.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none'
  el.style.visibility = v < 0.002 ? 'hidden' : 'visible'
}
// slide in from below, out upward, based on where the beat sits in [a, z)
function slide(el, v, tb, a, z, dist) {
  const dir = inSpan(tb, a - 0.5, z) ? 1 : -1
  el.style.transform = `translateY(${(dir * (1 - clamp(v)) * dist).toFixed(2)}px)`
}
const popScale = (v) => lerp(0.5, 1, clamp(v, 0, 1.25))
function popStyle(el, v) {
  const p = clamp(v, 0, 1.25)
  el.style.opacity = clamp(p * 2)
  el.style.transform = `scale(${popScale(p)})`
  el.style.visibility = p < 0.002 ? 'hidden' : 'visible'
}

function seek(tIn) {
  const d = D()
  const t = ((tIn % d) + d) % d
  const tb = t / B
  const c = cam(t)
  els.world.style.transform = `scale(${c.toFixed(5)})`

  // canvas flood
  const wp = wipeState(t)
  els.stage.style.background = wp.prev
  const ox = 540 + curX(wp.t0) * cam(wp.t0), oy = 620 + curY(wp.t0) * cam(wp.t0)
  const rad = 1800 * S(wp.age, 1.25, 1)
  Object.assign(els.wipe.style, { left: ox - rad + 'px', top: oy - rad + 'px', width: 2 * rad + 'px', height: 2 * rad + 'px', background: wp.cur })
  // decor drifts once per loop so the last frame equals the first
  const ph = (t / d) * Math.PI * 2
  const ds = 0.85 + 0.05 * c
  $('decoRing').style.transform = `translate(${-250 + 34 * Math.sin(ph)}px, ${-200 + 26 * Math.cos(ph)}px) scale(${ds})`
  $('decoSquare').style.transform = `translate(${790 + 26 * Math.cos(ph)}px, ${780 + 34 * Math.sin(ph)}px) rotate(${(t / d) * 90 + 12}deg) scale(${ds})`
  $('decoDot').style.transform = `translate(${930 + 22 * Math.sin(ph * 2)}px, ${330 + 18 * Math.cos(ph)}px) scale(${ds})`
  $('decoStar').style.transform = `translate(${70 + 20 * Math.cos(ph * 2)}px, ${880 + 16 * Math.sin(ph)}px) rotate(${(t / d) * 360}deg)`

  // captions
  capEls.forEach((el, i) => {
    const s = SECTIONS[i], nx = SECTIONS[(i + 1) % SECTIONS.length]
    const v = capVis[i](t)
    visStyle(el, v, 12)
    if (v < 0.002) return
    slide(el, v, tb, s.at + CAP_IN, nx.at - CAP_OUT, 30)
  })

  // shape
  const w = shapeW(t)
  const h = shapeH(t)
  const r = Math.min(shapeR(t), h / 2, w / 2)
  // the chat head hops twice while it waits for the click
  const hop = since(tb, 20.2) < 1 ? Math.sin(Math.PI * since(tb, 20.2) * 2) : 0
  const bob = 9 * hop * hop
  const sp = 1 - 0.05 * shapePress(t)
  Object.assign(els.shape.style, {
    width: w + 'px', height: h + 'px', left: -w / 2 + 'px', top: -h / 2 + 'px', borderRadius: r + 'px',
    transform: `translateY(${-bob}px) scale(${sp})`,
    boxShadow: '0 1px 2px rgba(23,17,43,0.14), 0 26px 50px -18px rgba(23,17,43,0.45)',
  })
  const sw = SHAPE_WIPES, si = latest(sw, tb)
  const sAge = since(tb, sw[si].b) * B, sT0 = t - sAge
  const lx = clamp(curX(sT0) + w / 2, 0, w), ly = clamp(curY(sT0) + h / 2, 0, h)
  const sRad = Math.hypot(w, h) * S(sAge, 1.7, 1)
  els.shape.style.background = sw[(si - 1 + sw.length) % sw.length].color
  Object.assign($('shapeWipe').style, { left: lx - sRad + 'px', top: ly - sRad + 'px', width: 2 * sRad + 'px', height: 2 * sRad + 'px', background: sw[si].color })

  // layers
  for (const { s, el } of layers) {
    const v = layerVis[s.id](t)
    visStyle(el, v)
    if (v < 0.002) continue
    const fill = el.dataset.fill
    const lw = fill ? w : +el.dataset.w, lh = fill ? h : +el.dataset.h
    Object.assign(el.style, { width: lw + 'px', height: lh + 'px', left: (w - lw) / 2 + 'px', top: (h - lh) / 2 + 'px' })
    el.style.transform = `scale(${lerp(0.96, 1, clamp(v))})`
  }

  // install
  const ih = clamp(instHover(t))
  $('instBtn').style.transform = `scale(${1 + 0.08 * ih - 0.1 * clamp(cursorPress(t)) * ih})`
  const ip = clamp(instP(t))
  $('instBar').style.width = 372 * ip + 'px'
  $('instPct').textContent = Math.round(ip * 100) + '%'
  $('readyCheck').style.strokeDashoffset = (1 - clamp(readyCheck(t))).toFixed(4)

  // versions
  const rv = clamp(verRowsVis(t))
  $('verRows').style.opacity = rv
  $('verDiv').style.opacity = rv
  const hl = verHlRow(t)
  Object.assign($('verHl').style, { top: 102 + hl * VER_ROW + 'px', opacity: rv })
  rowEls.forEach((el, i) => { const on = Math.abs(hl - i) < 0.5; el.style.color = on && rv > 0.5 ? '#2F5BFF' : INK; el.style.fontWeight = on ? 700 : 500 })
  $('chev').style.transform = `rotate(${180 * chevRot(t)}deg)`
  const va = verAVis(t), vb = verBVis(t)
  visStyle($('verA'), va, 6); slide($('verA'), va, tb, 8.14, 10.6, 34)
  visStyle($('verB'), vb, 6); slide($('verB'), vb, tb, 10.65, 12, 34)
  popStyle($('verOk'), verOkVis(t))

  // upload: the file rides the cursor, the zone lights up, then restores
  const fv = fileVis(t)
  const dropped = inSpan(tb, 13.45, 11.4)
  visStyle($('file'), fv, 4)
  Object.assign($('file').style, {
    left: curX(t) - 26 + 'px', top: curY(t) - 22 + 'px',
    transform: `rotate(${(dropped ? 0 : -6 + 4 * clamp((tb - 12.4) / 1.0)).toFixed(2)}deg) scale(${dropped ? lerp(0.6, 1, clamp(fv)) : 1 + 0.04 * clamp(cursorPress(t))})`,
  })
  const zh = clamp(zoneHot(t))
  Object.assign($('zone').style, { borderColor: mixColor('#C9C2E8', '#FF7A1A', zh), background: mixColor('#F8F6FF', '#FFF1E6', zh) })
  $('zone').style.transform = `scale(${1 + 0.03 * zh})`
  const za = zoneAVis(t), zb = zoneBVis(t)
  visStyle($('zoneA'), za, 8); visStyle($('zoneB'), zb, 8)
  $('zoneB').style.transform = `scale(${lerp(0.94, 1, clamp(zb))})`
  const up = clamp(upP(t))
  $('upBar').style.width = 232 * up + 'px'
  const ud = upDone(t)
  popStyle($('upCheck'), ud)
  $('zipBig').style.opacity = 1 - clamp(ud * 2)
  const us = $('upStat')
  if (inSpan(tb, 15.1, 16)) { us.textContent = TEXT.restored; us.style.color = '#0E8F5A' }
  else { us.textContent = `${TEXT.restoring} ${Math.round(up * 100)}%`; us.style.color = '#7A7590' }

  // cloud: switch, then ring
  const tg = clamp(tog(t), -0.1, 1.15)
  $('tog').style.background = mixColor('#DCD8EA', C.cyan, clamp(tg))
  $('togKnob').style.left = 4 + 32 * tg + 'px'
  const rp = clamp(ringP(t))
  $('ringFill').style.strokeDashoffset = (1 - rp).toFixed(4)
  const rc = clamp(ringCheck(t))
  $('ringFill').style.stroke = mixColor(C.cyan, C.green, rc)
  $('ringCheck').style.strokeDashoffset = (1 - rc).toFixed(4)
  $('ringBody').style.opacity = 1 - clamp(rc * 2.5)
  $('ringPct').textContent = Math.round(rp * 100) + '%'
  $('ringCloud').style.transform = `translateY(${(-4 * Math.abs(Math.sin(tb * Math.PI))).toFixed(2)}px)`

  // chat head: badge, ripple
  const bv = clamp(badgeVis(t), 0, 1.3)
  $('badge').style.transform = `translateY(${-bob}px) scale(${bv})`
  $('badge').style.visibility = bv < 0.002 ? 'hidden' : 'visible'
  const ro = clamp(rippleOn(t))
  const rq = (since(tb, 20.3) * B / 0.6) % 1
  $('ripple').style.opacity = (ro * (1 - rq)).toFixed(3)
  $('ripple').style.transform = `scale(${1 + 0.5 * rq})`
  $('ripple').style.visibility = ro < 0.002 ? 'hidden' : 'visible'

  // chat
  $('chatStat').textContent = tb > 21.9 && tb < 22.8 ? TEXT.typing : TEXT.online
  for (const [id, f] of [['m1', m1Vis], ['m2', m2Vis], ['m3', m3Vis], ['dots', dotsVis]]) popStyle($(id), f(t))
  dotEls.forEach((el, i) => { el.style.transform = `translateY(${(-4 * Math.max(0, Math.sin((tb * 2.4 - i * 0.22) * Math.PI))).toFixed(2)}px)` })

  // QR scan line
  const scp = clamp((tb - 24.45) / 0.95)
  Object.assign($('scan').style, { top: 26 + 204 * (0.5 - 0.5 * Math.cos(scp * Math.PI)) + 'px', opacity: clamp(scanVis(t)) })

  // phone: PIN, unlock, messages
  const pv = pinViewVis(t)
  visStyle($('pinView'), pv, 8)
  $('pinView').style.transform = `translateY(${(tb > 26.9 && tb < 28.5 ? -(1 - clamp(pv)) * 60 : 0).toFixed(2)}px)`
  $('shackle').style.transform = `translateY(${(-3 * clamp(unlock(t), 0, 1.2)).toFixed(2)}px)`
  PIN_AT.forEach((b, i) => {
    const on = inSpan(tb, b, 28)
    pinDotEls[i].style.background = on ? INK : 'transparent'
    pinDotEls[i].style.transform = `scale(${1 + (on ? 0.5 * pulse((tb - b) * B, 6) : 0)})`
  })
  const av = appViewVis(t)
  visStyle($('appView'), av, 8)
  $('appView').style.transform = `scale(${lerp(1.06, 1, clamp(av))})`
  popStyle($('p1'), p1Vis(t))
  popStyle($('p2'), p2Vis(t))

  // outro chips
  chipEls.forEach((el, i) => {
    const v = clamp(chipVis[i](t), 0, 1.3)
    visStyle(el, Math.min(1, v), 6)
    el.style.transform = `translateY(${(1 - Math.min(1, v)) * 16}px) scale(${popScale(v)})`
  })

  // cursor (screen space, constant size)
  const cx = curX(t), cy = curY(t)
  const sx = 540 + cx * c, sy = 620 + cy * c
  els.cursor.style.transform = `translate(${(sx - 6).toFixed(2)}px, ${(sy - 4).toFixed(2)}px) scale(${1 - 0.14 * clamp(cursorPress(t))})`
}

// ---------- sound cues, exported to the mixer so each sound sits on its event ----------
function cues() {
  const list = [
    ...CLICKS.map((b) => ({ b, kind: 'click' })),
    ...SECTIONS.map((s) => ({ b: s.at, kind: 'swish' })),
    ...[5, 6.9, 17.3, 21.2, 25.6].map((b) => ({ b, kind: 'swish' })), { b: 9, kind: 'swish', soft: 1 }, { b: 10.5, kind: 'swish', soft: 1 },
    { b: 12.2, kind: 'press' }, { b: 13.45, kind: 'drop' },
    { b: 7.0, kind: 'success' }, { b: 11.1, kind: 'pop' }, { b: 15.1, kind: 'success' }, { b: 18.6, kind: 'success' },
    { b: 20.6, kind: 'pop' }, { b: 21.55, kind: 'msg' }, { b: 22.8, kind: 'msg' }, { b: 23.35, kind: 'msg', out: 1 },
    ...PIN_AT.map((b) => ({ b, kind: 'tick', key: 1 })), { b: 26.95, kind: 'success' }, { b: 27.15, kind: 'msg' }, { b: 27.5, kind: 'msg', out: 1 },
    ...chipVis.map((_, i) => ({ b: 28.55 + 0.14 * i, kind: 'pop', soft: 1 })),
  ]
  return list.map((c) => ({ ...c, t: (((c.b % BEATS) + BEATS) % BEATS) * B }))
}

// ---------- api ----------
window.seek = seek
window.configure = ({ beat }) => { if (beat) B = beat }
window.timeline = () => ({ beat: B, beats: BEATS, duration: D(), lang: LANG, cues: cues() })
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]).then(() => { layoutStatic(); seek(0) })

if (!window.__RENDER__) {
  document.body.classList.add('preview')
  const fit = () => document.body.style.setProperty('--fit', Math.min(innerWidth, innerHeight) / 1080)
  fit(); addEventListener('resize', fit)
  const params = new URLSearchParams(location.search)
  window.ready.then(() => {
    if (params.has('t')) seek(+params.get('t'))
    else {
      const t0 = performance.now()
      const loop = () => { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop) }
      loop()
    }
  })
}
</script>
