name: android

on:
  pull_request:
    paths:
      - 'packaging/android/**'
      - '.github/workflows/android.yml'
  push:
    branches:
      - main
    paths:
      - 'packaging/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app's own code, compiled and linted on every change to it. The APK
  # itself is built only for a release: it carries Termux's packages, whose
  # mirror keeps current builds only, so a full build here would start failing
  # whenever a pin ages, for reasons nothing in the change has to do with. The
  # Java needs none of that to be checked.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # Calls that need a newer Android than the app's minimum, unguarded, are
      # a crash on the older phones nobody tests on; lint fails the build on them.
      - run: ./gradlew compileReleaseJavaWithJavac lintRelease --console=plain
