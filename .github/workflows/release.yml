name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: pwsh packaging/windows/package-release.ps1
      - name: Create checksum
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath build -Filter 'SillyTavernManager-windows-x64-*.zip' | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($archive.FullName).sha256" -Value "$hash  $($archive.Name)" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            build/SillyTavernManager-windows-x64-*.zip
            build/SillyTavernManager-windows-x64-*.zip.sha256

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sillytavern-manager:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/sillytavern-manager:latest

  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: build/npm/*.tgz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, npm-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release/npm
      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true

  # The same tarball the GitHub Release carries, published to npm, so a version
  # cannot exist in one place with different bytes in the other. It runs after
  # the release exists: npm cannot unpublish a version after 72 hours, a GitHub
  # Release can be deleted and cut again.
  npm-publish:
    needs: [publish, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing. The job proves to npm which workflow in which
      # repository it is, and npm answers with a short-lived token, so there is
      # no npm token in this repository's secrets for anyone to steal or rotate.
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 still carries npm 10, and trusted publishing wants 11.5.1 or
      # newer. This is the npm the repository already pins for its own work.
      - run: npm install --global npm@11.12.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release/npm
      # Provenance is attached without asking for it, because this is a public
      # package published from a public repository through OIDC.
      - name: Publish to npm
        shell: bash
        run: npm publish --access public release/npm/*.tgz
