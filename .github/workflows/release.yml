name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: pwsh packaging/windows/package-release.ps1
      - name: Create checksum
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath build -Filter 'SillyTavernManager-windows-x64-*.zip' | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($archive.FullName).sha256" -Value "$hash  $($archive.Name)" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            build/SillyTavernManager-windows-x64-*.zip
            build/SillyTavernManager-windows-x64-*.zip.sha256

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sillytavern-manager:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/sillytavern-manager:latest

  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: build/npm/*.tgz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, npm-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release/npm
      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true
