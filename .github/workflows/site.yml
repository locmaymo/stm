# The project site, and the OAuth relay page that lives on it.
#
# Deployed on every push to main that touches it, because the relay page is
# part of how the manager signs in to Cloudflare: a change to it that sits
# undeployed is a sign-in that behaves differently from the code it ships with.
# Everything else on the domain - the landing page, the documentation, the
# legal documents - is static and has no reason to wait either.
#
# `paths` keeps it from running on changes that cannot reach the site. The
# legal documents are in `packages/legal` and are read at build time, so they
# are listed even though they are not under `apps/site`.
name: site

on:
  push:
    branches:
      - main
    paths:
      - 'apps/site/**'
      - 'packages/legal/**'
      - 'deploy/oauth-relay/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never an older commit over a newer one. Not
# cancelled in progress: a half-finished upload is worse than a wasted minute.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Named for what it publishes, so the repository's Deployments box says
    # where this went rather than that something called `site` happened, and
    # links to it.
    environment:
      name: stm.locmaymo.top
      url: https://stm.locmaymo.top
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The gate that guards every other change guards this one too: the legal
      # documents and the site strings are the same UTF-8, JSON and locale
      # parity rules, and a broken one would be published rather than caught.
      - run: npm run encoding:gate

      # Built here rather than committed: `apps/site/dist` is generated output
      # and is not in the repository.
      - run: npm run site:build

      # The pages have to exist before Wrangler is asked to upload them, and a
      # silently empty `dist` would publish an empty site over a working one.
      - name: Check the build produced pages
        run: |
          test -f apps/site/dist/index.html
          test -f apps/site/dist/oauth/cloudflare/callback.html

      # The repository's own Wrangler, from `npm ci` above, rather than
      # `cloudflare/wrangler-action`: that action installs a Wrangler of its
      # own choosing, and the one it chose was 3.90, which cannot deploy a
      # Worker that is only static assets - it demanded an entry point this
      # site does not have. The version is now pinned in `package.json` and
      # locked, so CI and a maintainer's own machine run the same one. It also
      # keeps the step that holds an API token down to code this repository
      # can see.
      - name: Deploy
        working-directory: deploy/oauth-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
