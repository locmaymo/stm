name: verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A branch pushed again while a run is still going does not need the older
# answer, and the newer commit is the one anybody is waiting on.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Both, because the manager runs on both and they disagree about things
    # that matter here: how a child process is started, how a path is spelled,
    # and which line ending a file is written with.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The encoding gate, eslint, tsc and the test suite, the same one command
      # that has to pass before anything is committed.
      - run: npm run verify
